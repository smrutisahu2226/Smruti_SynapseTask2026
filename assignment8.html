<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Expense Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(to right, #a1c4fd, #c2e9fb);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      text-align: center;
      color: #01579b;
      margin: 30px;
      text-shadow: 1px 1px 2px #fff;
    }

    .main-container {
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 30px;
      padding: 20px;
      width: 100%;
      max-width: 1200px;
    }

    .form-container {
      background: #e1f5fe;
      padding: 20px 30px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: row;
      gap: 15px;
      flex-wrap: wrap;
      align-items: flex-end;
      width: 100%;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 150px;
    }

    label {
      font-weight: bold;
      margin-bottom: 5px;
      color: #0277bd;
    }

    input {
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }

    input:focus {
      outline: 2px solid #4fc3f7;
    }

    button {
      padding: 12px 20px;
      border: none;
      background: #0288d1;
      color: white;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s ease;
    }

    button:hover {
      background: #0277bd;
      transform: scale(1.05);
    }

    .table-section {
      flex: 1;
      max-width: 700px;
      width: 100%;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background-color: white;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
    }

    thead {
      background: #0288d1;
      color: white;
    }

    th, td {
      padding: 15px;
      text-align: center;
    }

    tbody tr:nth-child(even) {
      background-color: #f1f8ff;
    }

    .delete-btn {
      background: #ef5350;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
    }

    .delete-btn:hover {
      background: #c62828;
    }

    #summary {
      margin-top: 20px;
      padding: 20px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 15px;
      text-align: center;
      font-size: 18px;
      color: #01579b;
      box-shadow: 0 6px 12px rgba(0,0,0,0.1);
      backdrop-filter: blur(6px);
      max-width: 800px;
      width: 90%;
    }

    @media (max-width: 768px) {
      .main-container {
        flex-direction: column;
        align-items: center;
      }

      .form-container {
        flex-direction: column;
      }

      table, th, td {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <h1>💸 Expense Tracker</h1>

  <div class="main-container">
    <div class="form-container">
      <div class="form-group">
        <label for="Date">Date</label>
        <input type="date" id="Date">
      </div>
      <div class="form-group">
        <label for="des">Description</label>
        <input type="text" id="des" placeholder="e.g. Groceries">
      </div>
      <div class="form-group">
        <label for="amn">Amount</label>
        <input type="number" id="amn" placeholder="e.g. 500">
      </div>
      <div class="form-group">
        <button onclick="addexpense()" id="addy">➕ Add Expense</button>
      </div>
    </div>

    <div class="table-section">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Description</th>
            <th>Amount (₹)</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="expensetable"></tbody>
      </table>
    </div>
  </div>

  <div id="summary">
    <p>Total Expense: ₹<span id="totalexpense">0.00</span></p>
    <p>Average Daily Expense: ₹<span id="averageexpense">0.00</span></p>
  </div>

  <script>
    let expenses = [];

    window.onload = function () {
      const saved = localStorage.getItem("expenses");
      if (saved) {
        expenses = JSON.parse(saved);
        updateTable();
      }
    };

    function addexpense() {
      let date = document.getElementById("Date").value;
      let description = document.getElementById("des").value;
      let amount = parseFloat(document.getElementById("amn").value);

      if (!date || !description || isNaN(amount) || amount <= 0) {
        alert("Please enter valid details!");
        return;
      }

      expenses.push({ date, description, amount });
      localStorage.setItem("expenses", JSON.stringify(expenses));
      updateTable();
      clearinputs();
    }

    function deleteExpense(index) {
      expenses.splice(index, 1);
      localStorage.setItem("expenses", JSON.stringify(expenses));
      updateTable();
    }

    function updateTable() {
      const table = document.getElementById("expensetable");
      table.innerHTML = "";

      let total = 0;
      let uniqueDates = new Set();

      expenses.forEach((expense, index) => {
        total += expense.amount;
        uniqueDates.add(expense.date);

        const row = `
          <tr>
            <td>${expense.date}</td>
            <td>${expense.description}</td>
            <td>₹${expense.amount.toFixed(2)}</td>
            <td><button class="delete-btn" onclick="deleteExpense(${index})">Delete</button></td>
          </tr>
        `;
        table.innerHTML += row;
      });

      document.getElementById("totalexpense").innerText = total.toFixed(2);
      const avg = uniqueDates.size > 0 ? total / uniqueDates.size : 0;
      document.getElementById("averageexpense").innerText = avg.toFixed(2);
    }

    function clearinputs() {
      document.getElementById("Date").value = "";
      document.getElementById("des").value = "";
      document.getElementById("amn").value = "";
    }
  </script>
</body>
</html>
