<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CalcGenius</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(to right, #d0f0fd, #cce5ff);
    }

    h1 {
      color: #003049;
      margin-bottom: 20px;
      font-size: 2.5rem;
      letter-spacing: 1px;
    }

    .calculator {
      background: rgba(255, 255, 255, 0.95);
      padding: 30px 25px;
      border-radius: 20px;
      border: 4px double #4fc3f7;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
      width: 350px;
      box-sizing: border-box;
    }

    input {
      width: 100%;
      padding: 18px;
      font-size: 1.6rem;
      text-align: right;
      margin-bottom: 25px;
      border-radius: 12px;
      border: none;
      background: #e3f2fd;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
      box-sizing: border-box;
      color: #0d1b2a;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }

    button {
      padding: 18px;
      font-size: 1.2rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      background: #bbdefb;
      color: #0d1b2a;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 8px rgba(0,0,0,0.05);
    }

    button:hover {
      background: #90caf9;
      transform: scale(1.05);
    }

    .equal {
      background: #4fc3f7;
      color: #fff;
    }

    .equal:hover {
      background: #29b6f6;
    }

    .clear {
      background: #ef9a9a;
      color: white;
    }

    .clear:hover {
      background: #e57373;
    }

    .backspace {
      background: #a5d6a7;
      color: white;
    }

    .backspace:hover {
      background: #81c784;
    }
  </style>
</head>
<body>

<h1>CalcGenius</h1>
<div class="calculator">
  <input type="text" id="display" readonly />
  <div class="buttons">
    <button onclick="append('7')">7</button>
    <button onclick="append('8')">8</button>
    <button onclick="append('9')">9</button>
    <button onclick="append('/')">/</button>

    <button onclick="append('4')">4</button>
    <button onclick="append('5')">5</button>
    <button onclick="append('6')">6</button>
    <button onclick="append('*')">*</button>

    <button onclick="append('1')">1</button>
    <button onclick="append('2')">2</button>
    <button onclick="append('3')">3</button>
    <button onclick="append('-')">-</button>

    <button onclick="append('0')">0</button>
    <button onclick="append('.')">.</button>
    <button onclick="append('+')">+</button>
    <button class="equal" onclick="calculate()">=</button>

    <button class="clear" onclick="clearDisplay()">C</button>
    <button class="backspace" onclick="deleteLast()">←</button>
  </div>
</div>

<script>
  function append(val) {
    document.getElementById('display').value += val;
  }

  function calculate() {
    try {
      const expression = document.getElementById('display').value;
      const result = eval(expression);
      document.getElementById('display').value = result;
      storeData(result);
    } catch (e) {
      document.getElementById('display').value = 'Error';
    }
  }

  function storeData(result) {
    localStorage.setItem('lastResult', result);
  }

  function clearDisplay() {
    document.getElementById('display').value = '';
  }

  function deleteLast() {
    const current = document.getElementById('display').value;
    document.getElementById('display').value = current.slice(0, -1);
  }
</script>

</body>
</html>
